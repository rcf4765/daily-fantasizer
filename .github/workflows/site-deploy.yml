name: Deploy the sign-up site (Cloudflare, free plan)

# Puts the "any league" website (multi/worker) on Cloudflare's free plan, or updates it. Run it from the Actions tab
# (Run workflow). First run creates the database and paper storage; later runs just update.
# Needs four repo secrets (Settings → Secrets and variables → Actions), all free:
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template, plus D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → right-hand side
#   FZ_GITHUB_TOKEN        GitHub fine-grained token for this repo with Actions: Read and write (lets the site start jobs)
#   FZ_MASTER_KEY          any long random text; the site's keys are derived from it (never change it afterwards)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MASTER: ${{ secrets.FZ_MASTER_KEY }}
      GH_PAT: ${{ secrets.FZ_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the secrets
        run: |
          miss=""; for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MASTER GH_PAT; do [ -n "${!v}" ] || miss="$miss $v"; done
          [ -z "$miss" ] || { echo "::error::Missing repo secrets:$miss (MASTER = FZ_MASTER_KEY, GH_PAT = FZ_GITHUB_TOKEN). See the top of this file."; exit 1; }
          [ ${#MASTER} -ge 24 ] || { echo "::error::FZ_MASTER_KEY must be at least 24 characters."; exit 1; }
      - name: Install
        run: cd multi/worker && npm install --no-audit --no-fund
      - name: Database, paper storage and address (created once)
        run: |
          cf() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          A="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          py() { python3 -c "import sys,json;d=json.load(sys.stdin);$1"; }
          DB=$(cf "$A/d1/database?name=fantasizer" | py "print(next((x['uuid'] for x in d.get('result') or [] if x['name']=='fantasizer'),''))")
          [ -n "$DB" ] || DB=$(cf -X POST "$A/d1/database" -d '{"name":"fantasizer"}' | py "print((d.get('result') or {}).get('uuid',''))")
          KV=$(cf "$A/storage/kv/namespaces?per_page=100" | py "print(next((x['id'] for x in d.get('result') or [] if x['title']=='fantasizer-papers'),''))")
          [ -n "$KV" ] || KV=$(cf -X POST "$A/storage/kv/namespaces" -d '{"title":"fantasizer-papers"}' | py "print((d.get('result') or {}).get('id',''))")
          SUB=$(cf "$A/workers/subdomain" | py "print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$SUB" ]; then SUB="fantasizer-$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-6)"; cf -X PUT "$A/workers/subdomain" -d "{\"subdomain\":\"$SUB\"}" >/dev/null; fi
          [ -n "$DB" ] && [ -n "$KV" ] && [ -n "$SUB" ] || { echo "::error::Couldn't set up storage. Check the API token's permissions (Workers Scripts, Workers KV Storage, D1: Edit)."; exit 1; }
          SITE="https://fantasizer.$SUB.workers.dev"
          cd multi/worker
          sed -i "s|REPLACE-WITH-D1-ID|$DB|; s|REPLACE-WITH-KV-ID|$KV|; s|https://fantasizer.YOUR-SUBDOMAIN.workers.dev|$SITE|" wrangler.toml
          echo "SITE=$SITE" >> "$GITHUB_ENV"
      - name: Tables
        run: cd multi/worker && npx wrangler d1 execute fantasizer --remote --file schema.sql
      - name: Extension download (points at this site)
        run: python3 multi/extension/pack.py
      - name: Deploy
        run: cd multi/worker && npx wrangler deploy
      - name: Keys
        run: |
          cd multi/worker
          k() { printf %s "$1" | openssl dgst -sha256 -hmac "$MASTER" -r | cut -d' ' -f1; }
          put() { echo "::add-mask::$2"; printf %s "$2" | npx wrangler secret put "$1" >/dev/null && echo "set $1"; }
          put SESSION_SECRET "$(k session)"; put ENC_KEY "$(k enc)"; put BUILD_TOKEN "$(k build)"; put LOGIN_KEY "$(k login)"
          put GITHUB_TOKEN "$GH_PAT"
      - name: Check it answers
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/login")
          echo "Site: $SITE  (login page answered $code)"
          { echo "### Site is up"; echo "$SITE"; echo; echo "Log in: $SITE/login"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ]
