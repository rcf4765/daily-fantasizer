name: Preview snapshot (unofficial)

# Snapshot of a week that may still be in progress, for sample editions only.
# Pushes preview/weekN_raw.txt to the separate `preview` branch (force-pushed, one
# commit). Nothing on main changes, so the Tuesday fetch, the official edition and
# the league website are unaffected.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week to snapshot"
        required: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Snapshot
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          WEEK: ${{ github.event.inputs.week }}
          PREVIEW: "1"
        run: python fetch_espn.py
      - name: Push snapshot to the preview branch
        run: |
          cp preview/week${{ github.event.inputs.week }}_raw.txt /tmp/snap.txt
          git config user.name "daily-fantasizer-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan preview
          git rm -rfq .
          mkdir -p preview && cp /tmp/snap.txt preview/week${{ github.event.inputs.week }}_raw.txt
          git add preview && git commit -qm "Unofficial preview snapshot, week ${{ github.event.inputs.week }}"
          git push -f origin preview
