name: Fantasizer leagues (print other leagues' papers)

# The printer for the shareable version (multi/). The website (multi/worker) starts this workflow:
#  - for one league right after it signs up or its commissioner changes settings (input slug);
#  - for every league on Tuesdays and Wednesdays (its own cron, slug blank).
# It never touches the Men Fantasizing paper, docs/ or data/.
# Needs: repo secret FZ_MASTER_KEY (BUILD_TOKEN is derived from it, as in site-deploy.yml); the website passes its
# address and a signature with every start.
# A push to the multi-league branch runs a self-test instead: the Men Fantasizing league built through the
# generic path (automatic copy, no Rule Changes/Betting), uploaded as a workflow artifact, nothing published.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "One league's id (blank = every league)"
        required: false
        default: ""
      site:
        description: "The website's address (the website fills this in)"
        required: false
        default: ""
      sig:
        description: "The website's signature of site|slug (the website fills this in)"
        required: false
        default: ""
  push:
    branches: [multi-league]
    paths: ["multi/**", ".github/workflows/fantasizer-leagues.yml"]

permissions:
  contents: read

concurrency:
  group: fantasizer-leagues-${{ github.event.inputs.slug || github.event_name }}
  cancel-in-progress: false

jobs:
  print:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y libcairo2 >/dev/null
      - run: pip install requests pillow cairosvg
      - name: Keys
        env:
          MASTER: ${{ secrets.FZ_MASTER_KEY }}
        run: |
          b=$(printf %s build | openssl dgst -sha256 -hmac "$MASTER" -r | cut -d' ' -f1); echo "::add-mask::$b"; echo "BUILD_TOKEN=$b" >> "$GITHUB_ENV"
      - name: Print
        env:
          SITE_URL: ${{ github.event.inputs.site || vars.FZ_SITE_URL }}
          SLUG: ${{ github.event.inputs.slug }}
          SIG: ${{ github.event.inputs.sig }}
          FZ_VAR_SITE: ${{ vars.FZ_SITE_URL }}
        run: python multi/run_all.py "$SITE_URL" "$SLUG"

  selftest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y libcairo2 >/dev/null
      - run: pip install requests pillow cairosvg
      - name: Shared player data
        run: python multi/shared_players.py "$RUNNER_TEMP/shared"
      - name: Build Men Fantasizing through the generic path (ESPN, private league cookies)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python - <<'EOF'
          import json, os
          json.dump({"slug": "selftest", "platform": "espn", "league_id": "1196354715", "season": 2026,
                     "espn_s2": os.environ["ESPN_S2"], "swid": os.environ["ESPN_SWID"],
                     "features": {"rules": False, "bets": False}, "accent": "#2d6a4f"},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "cfg.json"), "w"))
          EOF
          python multi/build_league.py --config "$RUNNER_TEMP/cfg.json" --work "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/out" --shared "$RUNNER_TEMP/shared"
          ls -la "$RUNNER_TEMP/out" "$RUNNER_TEMP/work/data"
      - name: Yahoo adapter (offline fixture league)
        run: python multi/platforms/test_yahoo.py
      - uses: actions/upload-artifact@v4
        with:
          name: selftest-paper
          path: ${{ runner.temp }}/out
          retention-days: 7
