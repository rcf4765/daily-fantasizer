name: Fantasizer leagues (print other leagues' papers)

# Self-test only. The real printer now runs in the private data repo (multi/data-repo/.github/workflows/print.yml,
# installed by site-deploy.yml). A push to the multi-league branch builds the Men Fantasizing league through the
# generic path (automatic copy, no Rule Changes/Betting) and uploads it as a workflow artifact; nothing is published.

on:
  push:
    branches: [multi-league]
    paths: ["multi/**", ".github/workflows/fantasizer-leagues.yml"]

permissions:
  contents: read

concurrency:
  group: fantasizer-leagues-${{ github.event.inputs.slug || github.event_name }}
  cancel-in-progress: false

jobs:
  selftest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y libcairo2 >/dev/null
      - run: pip install requests pillow cairosvg
      - name: Shared player data
        run: python multi/shared_players.py "$RUNNER_TEMP/shared"
      - name: Build Men Fantasizing through the generic path (ESPN, private league cookies)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python - <<'EOF'
          import json, os
          json.dump({"slug": "selftest", "platform": "espn", "league_id": "1196354715", "season": 2026,
                     "espn_s2": os.environ["ESPN_S2"], "swid": os.environ["ESPN_SWID"],
                     "features": {"rules": False, "bets": False}, "accent": "#2d6a4f"},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "cfg.json"), "w"))
          EOF
          python multi/build_league.py --config "$RUNNER_TEMP/cfg.json" --work "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/out" --shared "$RUNNER_TEMP/shared"
          ls -la "$RUNNER_TEMP/out" "$RUNNER_TEMP/work/data"
      - name: Yahoo adapter (offline fixture league)
        run: python multi/platforms/test_yahoo.py
      - uses: actions/upload-artifact@v4
        with:
          name: selftest-paper
          path: ${{ runner.temp }}/out
          retention-days: 7
