# The Daily Fantasizer for any league. Setup: multi/SETUP.md. Deployed by .github/workflows/site-deploy.yml, which
# fills in SITE_URL and DATA_REPO at deploy time (they stay placeholders in the repo).
# The site keeps nothing on Cloudflare: its data lives in the private GitHub data repo, and the data repo's workflows
# sign in to ESPN and print the papers. Moving hosts = run src/index.js anywhere with fetch() and the same secrets.
name = "fantasizer"
main = "src/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true   # keep the old workers.dev address answering (it forwards to SITE_URL)

# Paid plan only (optional): sign in to ESPN on Cloudflare's own browser instead of GitHub Actions (faster).
# browser = { binding = "BROWSER" }

[vars]
SITE_URL = "https://fantasizer.YOUR-SUBDOMAIN.workers.dev"   # no trailing slash
DATA_REPO = "OWNER/daily-fantasizer-data"
# Yahoo is reviewing our Fantasy API access (applied 2026-11-11, usually 1–2 weeks). While this says "1", every
# Log in with Yahoo button shows a short "being reviewed" note instead of Yahoo's page. Set it to "" once approved.
YAHOO_PENDING = "1"
# Secrets (set by the deploy workflow): SESSION_SECRET, ENC_KEY, BUILD_TOKEN, LOGIN_KEY (derived from FZ_MASTER_KEY)
# and GITHUB_TOKEN (FZ_GITHUB_TOKEN: reads/writes the data repo, starts its workflows); optional YAHOO_CLIENT_ID/_SECRET
