name: ESPN sign-in

# Lives in the private data repo (installed by site-deploy.yml in the code repo), so its runs and logs are private.
# Started by the website for each "Log in with ESPN": signs in on ESPN's real login page with a browser, waits for
# ESPN's emailed code when asked, and sends ESPN's session back to the website. The login arrives encrypted in this
# run's own inputs (LOGIN_KEY), is masked in the log, and is never written to disk or to this repo.
# Needs this repo's secret FZ_MASTER_KEY (the deploy sets it).

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Login job id"
        required: true
      login:
        description: "The login, encrypted"
        required: true
      site:
        description: "The website's address"
        required: true
      sig:
        description: "The website's signature of site|job"
        required: true

permissions:
  contents: read

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CODE_REPO
          path: code
          sparse-checkout: |
            multi/worker/src
            multi/login_runner
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser
        run: |
          cd code/multi/login_runner
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Keys
        env:
          MASTER: ${{ secrets.FZ_MASTER_KEY }}
        run: |
          k() { printf %s "$1" | openssl dgst -sha256 -hmac "$MASTER" -r | cut -d' ' -f1; }
          b=$(k build); l=$(k login); echo "::add-mask::$b"; echo "::add-mask::$l"
          echo "BUILD_TOKEN=$b" >> "$GITHUB_ENV"; echo "LOGIN_KEY=$l" >> "$GITHUB_ENV"
      - name: Sign in
        env:
          SITE: ${{ github.event.inputs.site }}
          JOB: ${{ github.event.inputs.job }}
          SIG: ${{ github.event.inputs.sig }}
          LOGIN: ${{ github.event.inputs.login }}
        run: node code/multi/login_runner/run.mjs
